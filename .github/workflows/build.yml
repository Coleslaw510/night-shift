name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  GODOT_VERSION: 4.4.1
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          ls ~/.local/share/godot/export_templates/
      - name: Import project
        run: godot --headless --import 2>&1 | tail -n 20 || true
      - name: Smoke test
        run: |
          godot --headless --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then echo "Script errors found"; exit 1; fi
          grep -q "SMOKE: done" smoke.log || { echo "Smoke test did not finish"; exit 1; }
          exit $code
        shell: bash
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/NightShift.exe
          cp README.md build/windows/README.txt
          cd build/windows && zip -r ../NightShift-1.1-Windows.zip .
      - name: Export macOS
        run: |
          mkdir -p build/mac
          godot --headless --export-release "macOS" build/mac/NightShift-1.1-Mac.zip
          ls -la build/mac
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-1.1-Windows
          path: build/NightShift-1.1-Windows.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-1.1-Mac
          path: build/mac/NightShift-1.1-Mac.zip
          compression-level: 0
