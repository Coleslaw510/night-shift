name: build
on:
  push:
    branches:
      - main
      - 'cursor/**'
  workflow_dispatch:
env:
  GODOT_VERSION: 4.4.1
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          ls ~/.local/share/godot/export_templates/
      - name: Import project
        run: godot --headless --import 2>&1 | tail -n 20 || true
      - name: Smoke test
        run: |
          godot --headless --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then echo "Script errors found"; exit 1; fi
          grep -q "SMOKE: done" smoke.log || { echo "Smoke test did not finish"; exit 1; }
          exit $code
        shell: bash
      - name: Reachability
        run: |
          godot --headless --script res://tests/reach_test.gd 2>&1 | tee reach.log
          code=${PIPESTATUS[0]}
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" reach.log; then echo "Script errors found"; exit 1; fi
          grep -q "REACH: done ok=true" reach.log || { echo "Reachability failed"; exit 1; }
          exit $code
        shell: bash
      - name: Simulation
        run: |
          godot --headless --script res://tests/sim_test.gd 2>&1 | tee sim.log
          code=${PIPESTATUS[0]}
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" sim.log; then echo "Script errors found"; exit 1; fi
          grep -q "SIM: done ok=true" sim.log || { echo "Simulation failed"; exit 1; }
          exit $code
        shell: bash
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/NightShift.exe
          cp README.md build/windows/README.txt
          cd build/windows && zip -r ../NightShift-1.2.1-Windows.zip .
      - name: Export macOS
        run: |
          mkdir -p build/mac
          godot --headless --export-release "macOS" build/mac/NightShift-1.2.1-Mac.zip
          ls -la build/mac
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-1.2.1-Windows
          path: build/NightShift-1.2.1-Windows.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-1.2.1-Mac
          path: build/mac/NightShift-1.2.1-Mac.zip
          compression-level: 0

  ios:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-macos-ios
      - name: Install Godot + iOS export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j t.tpz templates/ios.zip templates/version.txt -d templates && rm t.tpz
          ls -la ~/godot ~/godot/templates
      - name: Link templates
        run: |
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" && cp ~/godot/templates/* "$T/"
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV
      - name: Export Xcode project
        run: |
          $GODOT --headless --import 2>&1 | tail -n 5 || true
          mkdir -p build/ios
          $GODOT --headless --export-release "iOS" build/ios/NightShift.ipa 2>&1 | tee export.log
          ls -la build/ios
          test -d build/ios/NightShift.xcodeproj
          xcodebuild -list -project build/ios/NightShift.xcodeproj
      - name: Build (iphoneos, unsigned)
        run: |
          set -o pipefail
          cd build/ios
          xcodebuild -project NightShift.xcodeproj -scheme NightShift -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../../xcode.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          find dd/Build/Products -maxdepth 2 -name "*.app"
      - name: Package + verify IPA
        run: |
          APP=$(find build/ios/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          APPDIR="Payload/$(basename "$APP")"
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPDIR/Info.plist")
          lipo -info "$APPDIR/$BIN"
          lipo -info "$APPDIR/$BIN" | grep -q arm64
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion CFBundleDisplayName; do echo "$k=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APPDIR/Info.plist")"; done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPDIR/Info.plist")" = "com.coleslaw510.nightshift"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APPDIR/Info.plist")" = "16.0"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APPDIR/Info.plist" || true
          ls "$APPDIR" | head -40
          ls "$APPDIR" | grep -E "\.pck$"
          ls "$APPDIR" | grep -E "AppIcon|Assets.car"
          zip -qry NightShift-1.2.1.ipa Payload
          ls -lh NightShift-1.2.1.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-1.2.1-iOS-unsigned-ipa
          path: NightShift-1.2.1.ipa
          compression-level: 0
      - name: Simulator launch smoke test
        id: sim
        continue-on-error: true
        run: |
          set -o pipefail
          cd build/ios
          xcodebuild -project NightShift.xcodeproj -scheme NightShift -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simdd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../../sim-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=$(find simdd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP"
          cd ../..
          BID=com.coleslaw510.nightshift
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "build/ios/$APP"
          xcrun simctl launch "$UDID" "$BID"
          sleep 20
          xcrun simctl io "$UDID" screenshot sim-menu.png || true
          xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BID" || { echo "::error::app not running after 20 s"; exit 1; }
          echo "app alive after 20 s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: |
            export.log
            xcode.log
            sim-build.log
            sim-menu.png
          retention-days: 7
